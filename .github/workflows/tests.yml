name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dro is public; it lets the test paste a copied image into a real Dro page.
      - uses: actions/checkout@v4
        with:
          repository: airokz/Dro
          path: dro
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
          DRO_PATH: ${{ github.workspace }}/dro/whiteboard.html
